version: 2

models:
  - name: raw_news
    columns:
      - name: ID
        tests:
          - not_null
          - unique
      - name: RELATED
        tests:
          - not_null
      - name: PUBLISHED_AT
        tests:
          - not_null

  - name: raw_stocks
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - SYMBOL
            - TRADE_DATE
    columns:
      - name: SYMBOL
        tests:
          - not_null
      - name: TRADE_DATE
        tests:
          - not_null

  - name: raw_weather
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - CITY
            - DATE
    columns:
      - name: CITY
        tests:
          - not_null
      - name: DATE
        tests:
          - not_null
