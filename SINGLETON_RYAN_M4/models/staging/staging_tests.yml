version: 2

models:
  - name: raw_news
    columns:
      - name: ID
        tests:
          - not_null
          - unique
      - name: RELATED
        tests:
          - not_null
      - name: PUBLISHED_AT
        tests:
          - not_null

  - name: raw_stocks
    columns:
      - name: SYMBOL
        tests:
          - not_null
      - name: TRADE_DATE
        tests:
          - not_null
      # dbt_utils wont install in snowflake so test the combo this way
      - name: "SYMBOL || '|' || TRADE_DATE::VARCHAR"
        tests:
          - unique

  - name: raw_weather
    columns:
      - name: CITY
        tests:
          - not_null
      - name: DATE
        tests:
          - not_null
      - name: "CITY || '|' || DATE::VARCHAR"
        tests:
          - unique
